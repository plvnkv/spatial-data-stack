apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgis-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: gis-local-retain
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgis
spec:
  type: ClusterIP
  selector:
    app: postgis
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgis
spec:
  serviceName: postgis
  replicas: 1
  selector:
    matchLabels:
      app: postgis
  template:
    metadata:
      labels:
        app: postgis
    spec:
      containers:
      - name: postgres
        image: {{ .Values.image | quote }}
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgis-admin
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: [pg_isready, -h, 127.0.0.1, -U, postgres]
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgis-data
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgis
spec:
  podSelector:
    matchLabels:
      app: postgis
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          gis-postgis-client: "true"
    ports:
    - protocol: TCP
      port: 5432
