apiVersion: v1
kind: ConfigMap
metadata:
  name: martin-config
data:
  config.yaml: |
    listen_addresses: "0.0.0.0:3000"
    postgres:
      connection_string: ${DATABASE_URL}
      auto_publish: false
      tables: {{ .Values.tables | toJson }}
---
apiVersion: v1
kind: Service
metadata:
  name: martin
spec:
  selector:
    app: martin
  ports:
  - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: martin
spec:
  selector:
    matchLabels:
      app: martin
  template:
    metadata:
      labels:
        app: martin
        gis-postgis-client: "true"
      annotations:
        checksum/config: {{ .Values.tables | toJson | sha256sum }}
    spec:
      containers:
      - name: martin
        image: {{ .Values.image | quote }}
        args: [--config, /etc/martin/config.yaml]
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: martin-db
              key: password
        - name: DATABASE_URL
          value: "postgresql://martin:$(PGPASSWORD)@postgis:5432/gis"
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
        volumeMounts:
        - name: config
          mountPath: /etc/martin
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: martin-config
