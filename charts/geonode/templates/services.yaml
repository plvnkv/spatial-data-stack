{{- range $name, $port := dict "django" 8000 "geonode" 80 "geoserver" 8080 "redis" 6379 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
  - port: {{ $port }}
{{- end }}
{{- range $claim := list "geonode-statics" "geoserver-data" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: gis-local-retain
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $.Values.size }}
{{- end }}
